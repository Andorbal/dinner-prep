name: Chicken Quesadillas
summary: Crisp air-fried quesadillas cut into wedges and wrapped in foil, made to eat in the car.
serves: 4
spice: 1
handheld: true
cuisine: Tex-Mex
tags: [on-the-go, chicken]
night_of_minutes: 15
uses:
  - { component: lime-shredded-chicken, qty: 3, unit: cup }
ingredients:
  - { item: tortillas, qty: 8 }
  - { item: mexican-cheese, qty: 2, unit: cup }
  - { item: black-beans, qty: 1, unit: can, prep: rinsed and drained, optional: true }
sides:
  - { kind: veg, item: snap-peas, qty: 1, unit: lb }
  - { kind: veg, item: baby-carrots, qty: 1, unit: lb }
  - { kind: fruit, item: grapes, qty: 1, unit: lb }
steps:
  - Fill half of each tortilla with chicken, beans (for those who want them) and cheese, then fold.
  - Air-fry at 375°F for 6 to 8 minutes, two at a time, flipping once.
  - Cut into wedges, wrap in foil, and pack in an insulated bag with a towel on top. They stay warm 45 to 60 minutes.
  - Pack the veggies and grapes in a lidded container with a small cup of ranch or hummus.
