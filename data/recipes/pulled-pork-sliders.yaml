steps:
  - Warm the pork, covered, in the microwave for 3 minutes, or in the crock pot on Warm.
  - Toast the buns in the air fryer at 350°F for 2 minutes.
  - Pile pork on the buns and add barbecue sauce to taste. For the car, wrap in pairs in foil.
