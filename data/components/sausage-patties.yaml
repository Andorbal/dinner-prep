name: Browned sausage patties
summary: Turkey breakfast sausage, browned ahead so weeknight sandwiches and burritos only need a reheat.
yield: { qty: 6, unit: each, one: browned sausage patty, other: browned sausage patties }
storage:
  fridge_days: 4
  freezer_months: 2
  freeze: Vacuum-seal in a single layer.
  thaw: Reheat straight from frozen in the air fryer, 350°F for 6 minutes.
ingredients:
  - { item: sausage-patties, qty: 6 }
tools: [large-skillet, spatula, cooling-rack]
steps:
  - text: Lay the patties in a large skillet over medium heat (no oil needed). Cook about 4 minutes per side until browned (5 if they went in frozen).
    minutes: 10
    active: true
    gear: [stove]
  - text: Move to a paper-towel-lined plate to cool.
    minutes: 10
    active: false
