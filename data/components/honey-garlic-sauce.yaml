name: Honey-garlic sauce
summary: Sweet, glossy, kid-approved stovetop sauce for meatballs, chicken or stir-fries.
yield: { qty: 1, unit: cup }
storage:
  fridge_days: 14
  freezer_months: 3
  container: jar
  freeze: Freeze in a small jar or bag.
  thaw: Overnight in the fridge.
ingredients:
  - { item: honey, qty: 0.5, unit: cup }
  - { item: soy-sauce, qty: 0.333, unit: cup }
  - { item: garlic, qty: 3, unit: clove, prep: minced }
  - { item: ginger, qty: 1, unit: tsp, prep: grated }
  - { item: rice-vinegar, qty: 1, unit: tbsp }
  - { item: cornstarch, qty: 1, unit: tbsp }
  - { item: water, qty: 2, unit: tbsp, note: for the cornstarch }
tools: [small-saucepan, whisk, small-bowl, measuring-cups, measuring-spoons, garlic-press, microplane]
steps:
  - text: Put the honey, soy sauce, garlic, ginger and vinegar in a small saucepan over medium heat. Once it bubbles, turn it down and simmer 3 minutes.
    minutes: 5
    active: true
    gear: [stove]
  - text: In a small bowl, stir the cornstarch into the cold water until smooth. Whisk it into the pot and simmer 1 minute more, until glossy and thick.
    minutes: 2
    active: true
    gear: [stove]
  - text: Take it off the heat, cool, then pour into a jar.
    minutes: 10
    active: false
