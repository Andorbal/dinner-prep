name: Chicken, rice and bean burritos
summary: Foil-wrapped burritos rolled on prep day. Eat half this week, freeze the rest for late nights.
yield: { qty: 8, unit: each, one: chicken burrito, other: chicken burritos }
storage:
  fridge_days: 4
  freezer_months: 3
  container: foil
  freeze_in: foil, then a vacuum-seal bag
  freeze: Wrap each in foil, then vacuum-seal individually.
  thaw: No thaw needed. Microwave 2 minutes, then air-fry at 375°F for 4 minutes.
uses:
  - { component: lime-shredded-chicken, qty: 3, unit: cup }
  - { component: cooked-rice, qty: 3, unit: cup }
ingredients:
  - { item: black-beans, qty: 1, unit: can, prep: rinsed and drained }
  - { item: mexican-cheese, qty: 2, unit: cup }
  - { item: tortillas, qty: 8 }
tools: [can-opener, fine-strainer, measuring-cups, foil]
steps:
  - text: Warm the tortillas in the microwave for 30 seconds so they roll without cracking.
    minutes: 2
    active: true
    gear: [microwave]
  - text: Fill each with about 1/3 cup chicken, 1/3 cup rice, a spoonful of beans and 1/4 cup cheese. Fold in the sides and roll tightly.
    minutes: 12
    active: true
  - text: Wrap each burrito in foil and label it.
    minutes: 4
    active: true
