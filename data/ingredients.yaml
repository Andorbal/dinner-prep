# The ingredient catalog: every store-bought item a recipe or component can use.
#
#   name      what it's called in a recipe line (singular for counted items)
#   plural    plural for counted items (defaults to name + "s")
#   aisle     store section, used to order the grocery list
#   buy       bulk  = shelf-stable or freezable, bought every two weeks
#             fresh = produce, bakery, short-life dairy, bought weekly
#   staple    true = usually on hand; grocery list puts it under "check the pantry"
#   unit      the unit you shop in (omit for counted items)
#   convert   how many shop units one recipe unit is, when they don't convert
#             naturally (e.g. cheese bought by the oz, measured by the cup)
#   package   how it's sold: grocery list rounds up to whole packages
#   short     short name for compact side-dish lists (optional)
#   tags      used by rules.yaml (smooth, melon, avocado…)
#   cups      about how many cups one unit makes once prepped (per lb, or per each),
#             so portions can say "1 lb grapes (about 3 cups)"
#   prep_ahead  produce that can be washed or cut on prep day:
#             { days: how long it keeps once cut, how: what to do }
#   never_buy true = never on the grocery list (tap water)
#
# Everything a recipe uses must be here, staples included: the grocery list
# lists every item with the amount needed, so the pantry can be checked.

# ── Produce ────────────────────────────────────────────────────────────────
apples:          { name: apple, aisle: produce, buy: fresh, cups: 1.5 }
avocado:         { name: avocado, aisle: produce, buy: fresh, tags: [avocado] }
baby-carrots:    { name: baby carrots, aisle: produce, buy: fresh, unit: lb, cups: 3, prep_ahead: { days: 7, how: Portion straight from the bag. } }
baby-potatoes:   { name: baby potatoes, aisle: produce, buy: fresh, unit: lb }
baby-spinach:    { name: baby spinach, aisle: produce, buy: fresh, unit: oz, convert: { cup: 1 }, package: { size: 5, label: 5 oz box } }
bananas:         { name: banana, aisle: produce, buy: fresh }
broccoli:        { name: large broccoli crown, plural: large broccoli crowns, short: broccoli, aisle: produce, buy: fresh, cups: 4, prep_ahead: { days: 4, how: "Cut into bite-size florets (about 1 1/2 inches). Rinse, then dry well on a towel so they don't get slimy." } }
cantaloupe:      { name: cantaloupe, aisle: produce, buy: fresh, tags: [melon], cups: 5, prep_ahead: { days: 4, how: "Rinse the outside, cut in half and scoop out the seeds. Cut off the rind, then cut into 1-inch cubes." } }
clementines:     { name: clementine, aisle: produce, buy: fresh, package: { size: 15, label: 3 lb bag } }
garlic:          { name: garlic, aisle: produce, buy: fresh, unit: head, convert: { clove: 0.1 } }
ginger:          { name: fresh ginger, aisle: produce, buy: fresh, unit: knob, convert: { tsp: 0.1 } }
grapes:          { name: grapes, aisle: produce, buy: fresh, unit: lb, cups: 3, prep_ahead: { days: 5, how: "Rinse, pull off the stems, and pat dry with a towel." } }
green-beans:     { name: green beans, aisle: produce, buy: fresh, unit: lb, cups: 4, prep_ahead: { days: 4, how: "Rinse, snap off the stem ends, and dry." } }
lemons:          { name: lemon, aisle: produce, buy: fresh }
limes:           { name: lime, aisle: produce, buy: fresh }
pineapple:       { name: pineapple, aisle: produce, buy: fresh, cups: 5, prep_ahead: { days: 4, how: "Cut off the top and bottom, slice off the rind, quarter it lengthwise, cut out the core, then cut 1-inch chunks." } }
shredded-lettuce: { name: shredded lettuce, aisle: produce, buy: fresh, unit: oz, convert: { cup: 1.5 }, package: { size: 8, label: 8 oz bag } }
snap-peas:       { name: sugar snap peas, short: snap peas, aisle: produce, buy: fresh, unit: lb, cups: 4, prep_ahead: { days: 5, how: "Rinse, snap off the stem end (pull the string with it), and pat dry." } }

