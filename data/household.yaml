# Household settings. No names or personal details: the family is A, B, C and D.
# Everything here is about how we cook and eat, not who we are.

servings: 4

# Family members, used for recipe feedback in plan files.
members: [A, B, C, D]

# Feedback words you can use in a plan file, and how the generator scores them.
feedback_scale:
  love: 2
  like: 1
  meh: 0
  nope: -2

# Weeknights we plan for. Weekends are on their own.
dinner_days: [mon, tue, wed, thu, fri]

# Nights we usually get home after 7pm: dinner must be hand-held and eaten in the car.
# This is the default; data/schedule.yaml (or a dinner's `night:`) overrides it for a given date.
late_nights: [wed, thu]

# The kinds of night a dinner can be planned for.
night_types:
  regular: { label: At home, about: The usual. 10 to 15 minutes of finishing. }
  car: { label: In the car, about: Hand-held, wrapped in foil, eaten on the way. }
  microwave: { label: Grab and microwave, about: "Packed ahead in single containers: grab one from the fridge and reheat. Zero prep." }
  cook: { label: Cook night, about: A night with extra time for something a little more involved. Still uses prep where it can. }

# Prep happens the day before the week starts (Sunday for a Monday week).
prep_day: sun

# Two-week cycle. Week A = big prep with double batches frozen.
# Week B = light prep that runs on the frozen stock.
cycle:
  A: { prep_minutes: 120, label: Big prep week }
  B: { prep_minutes: 45, label: Light prep week }
  # How many freezable components get an extra batch for the freezer in Week A.
  double_batch_max: 2

# How far back the generator looks when balancing repeats against new meals.
history_weeks: 16
# A recipe served within this many weeks is avoided.
min_weeks_between_repeats: 3
# Roughly how many of the five dinners should be new-to-us or rarely served.
# Variety matters to us: the planner should add new recipes to the library every week.
new_recipes_per_week: 2

gear:
  - instant-pot
  - crock-pot
  - air-fryer
  - vacuum-sealer
  - stove
  - oven
  - microwave
  - stand-mixer
  - blender
  - stick-blender
  - food-processor
  # No rice cooker: rice is made on the stove.

# How many things each piece of gear can do at once (used to draft prep timelines).
gear_capacity:
  oven: 2
  stove: 3
  instant-pot: 1
  crock-pot: 1
  air-fryer: 1
  microwave: 1

# Added to every week's grocery list.
weekly_extras:
  - { item: milk, qty: 1, unit: gallon }
